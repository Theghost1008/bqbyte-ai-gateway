name: CI Pipeline

on: 
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v5
              with: 
                python-version: "3.12"
                cache: "pip"
                cache-dependency-path: requirements.txt

            - name: Install Dependencies
              run : |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run Test
              env: 
                FLOWISE_API_URL: "https://cloud.flowiseai.com/api/v1/prediction/460e24c5-5106-4d98-965a-b6873a02e7fc"
                FLOWISE_HEALTH_URL: "https://cloud.flowiseai.com/api/v1/ping"
              run: pytest -v

            # - name: Build Docker Image
            #   run: docker build -t bqbyte-ai-gateway .

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with: 
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: Build Docker Image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: eliteghost/bqbyte-ai-gateway:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max